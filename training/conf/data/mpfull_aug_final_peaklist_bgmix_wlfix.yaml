name: mpfull_aug_final_peaklist_bgmix_wlfix
DATA_DIR: ${oc.env:POWDERXRD_DATA_ROOT}/mpfull_aug_cag_strain_texture_bgmix_wlfix
# mpfull_aug_final_peaklist_bgmix.yaml retrained with the corrected CNRS background profile ("cnrs_wlfix" in mp_full/bg_noise_aug.py,
# fit after fixing the wavelength conversion in prep_opxrd_cnrs.py). Same keys/targets and the same clean
# val/test peak lists; only the CNRS share of the 50/50 train-set noise differs. The regenerated
# train_peaklist_bgmix_combined.pkl lives in its own directory, next to symlinks to the targets and val/test files.
xrd_train_file: train_peaklist_bgmix_combined.pkl
target_train_file: train_bispec_combined.pkl
xrd_val_file: val_peaklist.pkl
target_val_file: val_data_bispec_list.pkl
xrd_test_file: test_peaklist.pkl
target_test_file: test_data_bispec_list.pkl
batch_size: 64
indices: true
d_model: 256
is_normalized: false
