name: mpfull_aug_final_peaklist_bgmix_direct
DATA_DIR: ${oc.env:POWDERXRD_DATA_ROOT}/mpfull_aug_cag_strain_texture
# Direct-prediction (no bispectrum/inversion) counterpart to
# mpfull_aug_final_peaklist_bgmix.yaml, for comparing against the CNRS
# evaluation: same CNRS/RRUFF-mixed Gamma bg-noise-augmented peak-list input
# (train_peaklist_bgmix_combined.pkl) as the bispec+inversion peaklist_bgmix
# run, but the model regresses lattice params directly (out_dim [1,6]).
# val/test are the same clean val_peaklist.pkl/test_peaklist.pkl as every
# other peaklist run here -- bg-noise augmentation is train-set only.
xrd_train_file: train_peaklist_bgmix_combined.pkl
target_train_file: train_prim_lat_combined.pkl
xrd_val_file: val_peaklist.pkl
target_val_file: val_data_prim_lat.pkl
xrd_test_file: test_peaklist.pkl
target_test_file: test_data_prim_lat.pkl
batch_size: 64
indices: true
d_model: 256
is_normalized: true
