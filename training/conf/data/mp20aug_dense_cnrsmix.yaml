name: mp20aug_dense_cnrsmix
DATA_DIR: ${oc.env:POWDERXRD_DATA_ROOT}/mp20_aug/all_aug
# Ablation: identical to mp20aug.yaml (dense input, same MP-20 augmented data and targets) but with its OWN
# name, so training writes to $POWDERXRD_DATA_ROOT/mp20aug_dense_cnrsmix/... and cannot overwrite the
# checkpoints of the already-trained dense model, which lives under the name mp20aug_noise. Use it with
# train=default_cnrs_mix, which mixes the CNRS-fit background noise into half of the training batches.
xrd_train_file: all_aug_train_data_sim_xrd.pkl
target_train_file: all_aug_train_data_bispec.pkl
xrd_val_file: val_data_sim_xrd.pkl
target_val_file: val_data_bispec_list.pkl
xrd_test_file: test_data_sim_xrd.pkl
target_test_file: test_data_bispec_list.pkl
batch_size: 64
indices: false
d_model: 384
is_normalized: false
