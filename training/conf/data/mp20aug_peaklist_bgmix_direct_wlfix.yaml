name: mp20aug_peaklist_bgmix_direct_wlfix
DATA_DIR: ${oc.env:POWDERXRD_DATA_ROOT}/mp20_aug/all_aug_bgmix_wlfix
# mp20aug_peaklist_bgmix_direct.yaml retrained with the corrected CNRS background profile ("cnrs_wlfix"). Same
# regenerated train_peaklist_bgmix.pkl as mp20aug_peaklist_bgmix_wlfix.yaml; the *_prim_lat.pkl targets and the
# clean val/test peak lists are symlinks to the files in mp20_aug/all_aug.
xrd_train_file: train_peaklist_bgmix.pkl
target_train_file: all_aug_train_data_prim_lat.pkl
xrd_val_file: val_peaklist.pkl
target_val_file: val_data_prim_lat.pkl
xrd_test_file: test_peaklist.pkl
target_test_file: test_data_prim_lat.pkl
batch_size: 64
indices: true
d_model: 256
is_normalized: true
