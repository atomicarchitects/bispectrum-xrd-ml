[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powderxrd"
version = "0.1.0"
description = "Predicting unit cells from powder XRD data via bispectrum inversion and transformer models."
readme = "README.md"
requires-python = ">=3.10"
# Pinned to the exact versions verified to install cleanly and pass the test
# suite (Python 3.12, macOS arm64). Loosen individual pins if you need to
# combine this with another package that wants a different version.
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "tqdm==4.70.1",
    "h5py==3.16.0",
    "torch==2.14.0",
    "ase==3.29.0",
    "pymatgen==2026.9.24",
    "e3nn==0.6.0",
    "e3nn-jax==0.21.0",
    "matscipy==1.2.0",
    "cctbx-base==2025.11",
    "plotly==7.1.0",
    "spglib==2.7.0",
    "scikit-learn==1.9.1",
    "hydra-core==1.3.7",
    "omegaconf==2.3.1",
    "wandb==0.30.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
# Only needed to run the tutorial notebooks (fetching structures from the
# Materials Project). Not required by utilities.py, training/, or bispectrum/.
# NOTE: mp-api's dependency chain (via emmet-core) can be finicky with very
# recent pymatgen releases -- install this extra into a scratch env first.
notebooks = [
    "mp-api",
]

[tool.setuptools]
py-modules = ["utilities"]

[tool.pytest.ini_options]
testpaths = ["tests"]
